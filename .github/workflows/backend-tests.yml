name: Backend Tests

on:
  push:
    paths:
      - 'backend-py/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend-py/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend-py/requirements.txt

      - run: pip install -r requirements.txt pytest

      # Unit tests only — the live LLM regression test (p1_chat_test.py) is a
      # script run manually against a running server, not collected by pytest.
      - run: pytest tests/test_spec.py -q
