name: Backend Tests

on:
  push:
    paths:
      - 'backend-py/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend-py/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend-py/requirements.txt

      - run: pip install -r requirements.txt pytest

      # `python -m pytest` (not bare `pytest`) puts backend-py on sys.path so
      # `import app` resolves; run the WHOLE unit suite. The live LLM regression
      # test (p1_chat_test.py) is a manual script, not collected by pytest. The
      # critic tests are fail-soft / get_settings-stubbed → no live API call here.
      - run: python -m pytest -q
