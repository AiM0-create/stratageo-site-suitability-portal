name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build with live mode env vars
        run: npm run build
        env:
          VITE_APP_MODE: live
          VITE_AI_BACKEND_URL: https://stratageo-site-suitability-portal.vercel.app
          VITE_PY_BACKEND_URL: https://stratageo-engine-1020081478981.asia-south1.run.app
          VITE_CONVERSATIONAL_MODE: '1'
          # Rotatable kill-switch token (ships in bundle; not a true secret).
          # Rotate by updating this GH secret AND APP_SHARED_TOKEN on Cloud Run.
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
          # v1.12.0 — NO Mapbox token here on purpose. Baking it in put it in
          # the shipped JS and GitHub push protection rejected every deploy.
          # The frontend now fetches it at runtime from the engine's
          # /api/v2/map-config, so it never enters a build artifact and can be
          # rotated via the Cloud Run MAPBOX_TOKEN env var with no rebuild.

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
